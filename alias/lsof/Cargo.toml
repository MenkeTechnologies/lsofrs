# The `lsof` name on crates.io: `cargo install lsof` puts an `lsof` binary on
# PATH that runs lsofrs. Nothing is reimplemented here — the crate is a single
# `fn main()` over `lsofrs::run()`, so the alias can never drift from the tool.
[workspace]

[package]
name = "lsof"
version = "4.10.0"
edition = "2024"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
description = "The `lsof` command name for lsofrs — modern, high-performance lsof implementation in Rust"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/lsofrs"
homepage = "https://menketechnologies.github.io/lsofrs/"
documentation = "https://docs.rs/lsofrs"
keywords = ["lsof", "process", "files", "sockets", "diagnostics"]
categories = ["command-line-utilities", "os"]
readme = "README.md"

[[bin]]
name = "lsof"
path = "src/main.rs"

[dependencies]
lsofrs = "4.10.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
